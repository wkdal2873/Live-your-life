<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10172E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="순공 타이머, 플래너, 오답노트, 통계를 내 계정에 쌓아 가는 학습 관리 사이트">
<title>Live your life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
<style>
/* Layout: portrait = one column with a bottom tab bar; landscape tablet = side rail + two columns. Dark "ink" panels hold time and goals. */
:root {
  --bg: #F3F5F9; --surface: #FFFFFF; --surface-2: #F7F8FB; --track: #EBEEF4;
  --line: #E2E6EF; --line-strong: #C9D0DE; --card-line: #E9ECF3;
  --fg: #182035; --muted: #586079;
  --accent: #2B59D9; --accent-fill: #2B59D9; --on-accent: #FFFFFF; --accent-soft: #E7EDFD;
  --ink: #10172E; --on-ink: #FFFFFF; --ink-muted: #AEB8D6; --ink-line: rgba(255,255,255,.18); --ink-chip: rgba(255,255,255,.07); --ink-accent: #7FA0FF; --ink-accent-soft: rgba(127,160,255,.16);
  --good: #1A7A43; --mid: #9A5B00; --bad: #C2352F; --on-status: #FFFFFF; --status-empty: #8A91A5;
  --good-soft: #F1F9F4; --mid-soft: #FFF7E8; --bad-soft: #FDF2F1;
  --good-line: #BFE3CC; --mid-line: #F0D7A6; --bad-line: #F0C9C6;
  --good-text: #1A7A43; --bad-text: #C2352F;
  --break: #8E95A9;
  --scrim: rgba(16,23,46,.5); --shadow: 0 1px 3px rgba(20,28,60,.07);
  --toast-bg: #182035; --toast-fg: #FFFFFF;
  --s0: #2A78D6; --s1: #EB6834; --s2: #1BAF7A; --s3: #EDA100; --s4: #E87BA4; --s5: #008300; --s6: #6250D6; --s7: #E34948;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --font-num: 'Outfit', 'IBM Plex Sans KR', system-ui, sans-serif;
  --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0C1121; --surface: #151C31; --surface-2: #1A223B; --track: #232C49;
    --line: #283150; --line-strong: #3A4468; --card-line: #222B47;
    --fg: #E8ECF7; --muted: #A3ACC6;
    --accent: #8FA9F7; --accent-fill: #3D67E0; --on-accent: #FFFFFF; --accent-soft: #212D55;
    --ink: #1B2550; --ink-muted: #B9C3E0;
    --status-empty: #6E789A;
    --good-soft: #13261C; --mid-soft: #2B2210; --bad-soft: #2E1919;
    --good-line: #24503A; --mid-line: #5A4318; --bad-line: #5E2A2A;
    --good-text: #6FD39A; --bad-text: #FF8F8A;
    --break: #7C849C;
    --scrim: rgba(0,0,0,.6); --shadow: none;
    --toast-bg: #E8ECF7; --toast-fg: #10172E;
    --s0: #3987E5; --s1: #D95926; --s2: #199E70; --s3: #C98500; --s4: #D55181; --s5: #008300; --s6: #9085E9; --s7: #E66767;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.sub { font-size: 15px; color: var(--muted); }
.small { font-size: 13px; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.err { font-size: 14px; font-weight: 500; color: var(--bad-text); }
.ok { font-size: 14px; font-weight: 500; color: var(--good-text); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: clamp(0px, 3vw, 24px); }

/* Buttons & fields */
.btn { min-height: 48px; padding: 0 18px; border-radius: var(--r-sm); border: 1px solid transparent; font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: transparent; }
.btn:disabled { opacity: .45; }
.btn-primary { background: var(--accent-fill); color: var(--on-accent); font-weight: 700; }
.btn-ghost { background: var(--surface); border-color: var(--line-strong); color: var(--fg); }
.btn-outline { background: var(--surface); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.btn-danger { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad-text); }
.btn-sm { min-height: 40px; padding: 0 12px; font-size: 14px; }
.btn-wide { width: 100%; min-height: 58px; font-size: 17px; border-radius: 14px; }
.btn-dashed { width: 100%; min-height: 60px; border-radius: var(--r-md); border: 2px dashed var(--line-strong); background: transparent; color: var(--accent); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-dashed.tall { min-height: 84px; font-size: 18px; border-radius: var(--r-lg); }
.icon-btn { width: 44px; height: 44px; flex-shrink: 0; border: none; border-radius: var(--r-sm); background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.round-btn { width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; }
.round-btn:disabled { opacity: .35; }
.link-btn { min-height: 40px; padding: 0 8px; border: none; background: transparent; color: var(--accent); font-size: 15px; font-weight: 700; border-radius: 10px; }
.row-btns { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1; } .grow2 { flex: 2; }
input[type="text"], input[type="date"], input[type="email"], input[type="password"] { width: 100%; min-width: 0; min-height: 54px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); color: var(--fg); font-size: 17px; }
input::placeholder { color: var(--muted); opacity: .8; }
input[aria-invalid="true"] { border-color: var(--bad); }
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.label { font-size: 15px; font-weight: 600; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.seg-btn { min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: var(--muted); font-size: 16px; font-weight: 600; white-space: nowrap; }
.seg-btn[aria-pressed="true"] { background: var(--surface); color: var(--accent); font-weight: 700; box-shadow: 0 1px 2px rgba(20,28,60,.12); }

/* Sign-in */
.auth { position: fixed; inset: 0; z-index: 50; overflow-y: auto; }
.auth-start { background: var(--ink); color: var(--on-ink); padding-top: calc(28px + env(safe-area-inset-top, 0px)); padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
.home-inner { max-width: 640px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.home-hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; text-align: center; padding-top: 12px; }
.dial { width: clamp(130px, 30vmin, 230px); height: auto; }
.dial .track { stroke: var(--ink-line); }
.dial .arc { stroke: var(--accent-fill); }
.dial .hand { stroke: var(--on-ink); }
.auth-start h1 { font-family: var(--font-num); font-size: clamp(46px, 10vmin, 76px); font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.auth-start h1 span { color: var(--ink-accent); }
.home-tag { font-size: 19px; color: var(--ink-muted); margin-top: 14px; }
.feat { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.feat li { padding: 20px 12px; border-radius: 18px; background: var(--ink-chip); display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.feat-ico { width: 50px; height: 50px; border-radius: 14px; background: var(--ink-accent-soft); color: var(--ink-accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.feat-text { display: flex; flex-direction: column; gap: 4px; }
.feat strong { font-size: 17px; }
.feat-text span { font-size: 14px; color: var(--ink-muted); }
.home-ctas { display: flex; flex-direction: column; gap: 12px; }
.home-cta { width: 100%; min-height: 62px; border-radius: 18px; border: none; background: var(--accent-fill); color: var(--on-accent); font-size: 19px; font-weight: 700; }
.home-cta.alt { background: transparent; border: 1px solid rgba(255,255,255,.4); color: var(--on-ink); }
.boot-msg { text-align: center; font-size: 15px; color: var(--ink-muted); }
.auth-start :focus-visible { outline-color: var(--on-ink); }
.auth-form { background: var(--bg); padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
.auth-form-inner { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.auth-head { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; }
.mini-brand { font-family: var(--font-num); font-size: 21px; font-weight: 700; }
.mini-brand span { color: var(--accent); }
.auth-head h1 { font-size: clamp(34px, 7vw, 44px); font-weight: 700; letter-spacing: -.02em; }
.auth-head p:last-child { font-size: 17px; color: var(--muted); }
.auth-card { gap: 20px; padding: 28px; }
.divider { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 60px; }
.pw-eye { position: absolute; right: 5px; top: 5px; }
.check-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.check-row label { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-size: 16px; cursor: pointer; }
.check-row input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent-fill); }
.switch { text-align: center; font-size: 16px; color: var(--muted); }

/* Shell */
.shell { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
.top { flex-shrink: 0; padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-bottom: 4px; }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-num); font-size: 24px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.brand span { color: var(--accent); }
.top-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.top-date { font-size: 15px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.dday-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; background: var(--ink); color: var(--on-ink); font-size: 14px; font-weight: 700; white-space: nowrap; max-width: 220px; }
.dday-pill .ellip { font-weight: 500; color: var(--ink-muted); }
.me-btn { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 12px 4px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); min-width: 0; }
.me-name { font-size: 15px; font-weight: 600; max-width: 140px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; object-fit: cover; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
.avatar.lg { width: 64px; height: 64px; font-size: 26px; }
.banner { margin-top: 10px; padding: 12px 16px; border-radius: var(--r-sm); background: var(--mid-soft); border: 1px solid var(--mid-line); font-size: 15px; }
.main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.view { padding-block: 18px 32px; display: flex; flex-direction: column; gap: 20px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 6px; }
.view-head > div:first-child { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.view-head h1 { font-size: clamp(30px, 6vw, 40px); font-weight: 700; letter-spacing: -.02em; }
.view-head p { font-size: 17px; color: var(--muted); }
.tabs { flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.tabs .wrap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tab { min-height: 62px; border: none; border-radius: var(--r-md); background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.split, .split > .col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--card-line); border-radius: var(--r-lg); padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card-head h2, .block h2, .card h2 { font-size: 21px; font-weight: 700; }
.card-head > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.empty-line { padding: 12px 0; font-size: 16px; color: var(--muted); text-align: center; }
.hero-card { background: var(--ink); color: var(--on-ink); border-radius: var(--r-lg); padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; }
.hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hero-label { font-size: 16px; font-weight: 500; color: var(--ink-muted); }
.hero-num { font-size: clamp(42px, 9vw, 60px); font-weight: 600; line-height: 1; margin-top: 8px; letter-spacing: -.01em; }
.hero-side { font-size: 15px; color: var(--ink-muted); text-align: right; }
.hero-go { min-height: 60px; border-radius: 16px; border: none; background: var(--on-ink); color: #10172E; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 16px; }
.hero-go:focus-visible { outline-color: var(--on-ink); }

/* Study */
.subj-list { display: flex; flex-direction: column; gap: 10px; }
.subj-row { width: 100%; min-height: 72px; display: flex; align-items: center; gap: 14px; padding: 0 14px 0 18px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-align: left; }
.subj-row.is-edit { background: var(--surface-2); }
.sbar { width: 8px; height: 34px; border-radius: 4px; flex-shrink: 0; }
.subj-name { flex: 1; font-size: 19px; font-weight: 600; }
.subj-time { font-size: 21px; font-weight: 600; }
.play { width: 46px; height: 46px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.add-form { display: flex; flex-direction: column; gap: 8px; }
.add-row { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); flex-wrap: wrap; }
.add-row input { flex: 1 1 200px; }
.breakdown { display: flex; flex-direction: column; gap: 12px; }
.mini-label { font-size: 15px; font-weight: 600; color: var(--muted); }
.bd-row { display: grid; grid-template-columns: 124px minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.bd-name { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 16px; font-weight: 600; }
.bd-track { height: 12px; border-radius: 4px; background: var(--track); overflow: hidden; display: block; }
.bd-track span { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.bd-val { text-align: right; font-size: 15px; font-weight: 600; white-space: nowrap; }
.bd-val .muted { color: var(--muted); font-weight: 500; }
.foot-note { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }

/* Timeline */
.tl { display: flex; flex-direction: column; gap: 6px; }
.tl-row { display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: center; gap: 10px; }
.tl-label { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tl-label.is-today { color: var(--fg); font-weight: 700; }
.tl-track { position: relative; height: 22px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.tl-track.tall { height: 40px; border-radius: 8px; }
.tl-grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.tl-b { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; min-width: 3px; }
.tl-track.tall .tl-b { top: 5px; bottom: 5px; }
.tl-b.brk { background: repeating-linear-gradient(135deg, var(--break) 0 2px, transparent 2px 6px); box-shadow: inset 0 0 0 1px var(--break); }
.tl-axis { position: relative; height: 16px; }
.tl-axis span { position: absolute; top: 0; white-space: nowrap; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl.compact .tl-row { grid-template-columns: minmax(0, 1fr); }
.tl.compact .tl-label { display: none; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
.sw.brk { background: repeating-linear-gradient(135deg, var(--break) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--break); }

/* Calendar */
.cal { gap: 14px; }
.cal-head { display: flex; align-items: center; gap: 10px; }
.cal-title { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.cal-title h2 { font-size: 22px; }
.cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-dow span { text-align: center; font-size: 13px; font-weight: 600; color: var(--muted); }
.cal-cell { min-height: 74px; min-width: 0; padding: 6px 6px 7px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: flex; flex-direction: column; align-items: stretch; gap: 3px; text-align: left; overflow: hidden; }
.cal-cell.blank { border: none; background: transparent; }
.cal-num { font-family: var(--font-num); font-size: 16px; font-weight: 600; line-height: 1.2; }
.cal-cell.is-today { border-color: var(--accent); }
.cal-cell.is-today .cal-num { color: var(--accent); font-weight: 700; }
.cal-cell[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal-time { margin-top: auto; font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cal-bar { height: 5px; border-radius: 3px; background: var(--track); display: flex; gap: 1px; overflow: hidden; }
.cal-bar span { display: block; height: 100%; flex-shrink: 0; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Notes */
.block { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.pick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.pick { min-height: 190px; padding: 24px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 18px; text-align: left; }
.pick-primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
.pick-ico { width: 54px; height: 54px; border-radius: var(--r-md); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.pick-primary .pick-ico { background: rgba(255,255,255,.18); color: var(--on-accent); }
.pick-text { display: flex; flex-direction: column; gap: 4px; }
.pick-title { font-size: 21px; font-weight: 700; }
.pick-sub { font-size: 15px; color: var(--muted); }
.pick-primary .pick-sub { color: var(--on-accent); opacity: .9; }
.draft { flex-direction: row; gap: 22px; }
.draft-img { width: 240px; height: 320px; object-fit: cover; border-radius: var(--r-md); background: var(--surface-2); flex-shrink: 0; }
.draft-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.draft-body .row-btns { margin-top: auto; }
.draft-body .row-btns .btn { min-height: 52px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 46px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font-size: 16px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); font-weight: 700; }
.list-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.list-title { display: flex; align-items: baseline; gap: 10px; }
.note-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.note { position: relative; background: var(--surface); border: 1px solid var(--card-line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; padding: 0; text-align: left; color: var(--fg); min-width: 0; }
.note-img-btn { display: block; width: 100%; padding: 0; border: none; background: var(--surface-2); }
.note-img, .note-ph { display: block; width: 100%; max-width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: var(--surface-2); }
.note-body { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
.note-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); max-width: 100%; min-width: 0; }
.note-memo { font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
.note-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-height: 44px; flex-wrap: wrap; }
.note-actions .btn { min-height: 40px; padding: 0 12px; font-size: 14px; }
.note.selectable { border: 3px solid transparent; box-shadow: 0 0 0 1px var(--card-line); }
.note.selectable[aria-pressed="true"] { border-color: var(--accent); box-shadow: none; }
.check { position: absolute; top: 10px; left: 10px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--status-empty); background: var(--surface); color: var(--on-accent); display: flex; align-items: center; justify-content: center; }
.note.selectable[aria-pressed="true"] .check { background: var(--accent-fill); border-color: var(--accent-fill); }
.empty-box { border: 2px dashed var(--line-strong); border-radius: var(--r-lg); padding: 48px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--muted); }
.empty-title { font-size: 18px; font-weight: 600; color: var(--fg); }
.export-bar { position: sticky; bottom: 12px; display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 -4px 18px rgba(16,23,46,.1); }
.export-bar .btn { min-height: 56px; font-size: 17px; }

/* Plan */
.dday { background: var(--ink); color: var(--on-ink); border-radius: var(--r-lg); padding: 20px 20px 20px 26px; display: flex; align-items: center; gap: 16px; }
.dday-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.dday-title { font-size: 21px; font-weight: 700; }
.dday-date { font-size: 15px; color: var(--ink-muted); }
.dday-count { font-size: clamp(36px, 7vw, 52px); font-weight: 700; line-height: 1; white-space: nowrap; }
.on-ink { color: var(--on-ink); border: 1px solid var(--ink-line); background: var(--ink-chip); width: 48px; height: 48px; }
.on-ink:focus-visible { outline-color: var(--on-ink); }
.dd-grid { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 12px; }
.day { gap: 16px; overflow: hidden; }
.day-nav { display: flex; align-items: center; gap: 10px; }
.day-title { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.day-title-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.day-title h2 { font-size: clamp(20px, 4.4vw, 24px); font-weight: 700; letter-spacing: -.01em; }
.rel { font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
.rel-today { background: var(--accent-fill); color: var(--on-accent); }
.rel-future { background: var(--accent-soft); color: var(--accent); }
.rel-past { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.day-sum { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); font-size: 15px; }
.day-sum strong { font-weight: 700; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.wd { min-height: 70px; padding: 0; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.wd-dow { font-size: 13px; font-weight: 600; color: var(--muted); }
.wd-num { font-family: var(--font-num); font-size: 21px; font-weight: 500; line-height: 1.1; }
.wd-dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.wd.has .wd-dot { background: var(--accent); }
.wd.is-today { border-color: var(--accent); }
.wd.is-today .wd-num { font-weight: 700; }
.wd[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
.wd[aria-pressed="true"] .wd-dow { color: var(--on-accent); opacity: .85; }
.wd[aria-pressed="true"].has .wd-dot { background: var(--on-accent); }
.swipe { display: flex; flex-direction: column; gap: 12px; min-height: 300px; touch-action: pan-y; transition: transform .22s ease, opacity .22s ease; }
.swipe.in-right { animation: inRight .24s ease; }
.swipe.in-left { animation: inLeft .24s ease; }
@keyframes inRight { from { transform: translateX(56px); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes inLeft { from { transform: translateX(-56px); opacity: .3; } to { transform: none; opacity: 1; } }
.progress { display: flex; flex-direction: column; gap: 10px; padding: 0 2px; }
.counts { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.count-list { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 15px; font-weight: 600; }
.count { display: inline-flex; align-items: center; gap: 6px; }
.sq { width: 22px; height: 22px; border-radius: 6px; color: var(--on-status); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sq.sm { width: 12px; height: 12px; border-radius: 3px; }
.sq-done { background: var(--good); } .sq-partial { background: var(--mid); } .sq-miss { background: var(--bad); } .sq-none { background: var(--track); }
.stack { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; display: flex; gap: 2px; }
.stack span { display: block; height: 100%; flex-shrink: 0; }
.hint { font-size: 14px; color: var(--muted); }
.task { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 10px 8px 10px 10px; display: flex; flex-direction: column; gap: 10px; }
.task-row { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.cell { width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; border: 2px dashed var(--status-empty); background: var(--surface); color: var(--on-status); display: flex; align-items: center; justify-content: center; }
.task.st-done { background: var(--good-soft); border-color: var(--good-line); }
.task.st-partial { background: var(--mid-soft); border-color: var(--mid-line); }
.task.st-miss { background: var(--bad-soft); border-color: var(--bad-line); }
.task.st-done .cell { background: var(--good); border: 2px solid var(--good); }
.task.st-partial .cell { background: var(--mid); border: 2px solid var(--mid); }
.task.st-miss .cell { background: var(--bad); border: 2px solid var(--bad); }
.task.is-open { border-color: var(--accent); }
.task-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.task-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
.task-line .tag { flex-shrink: 0; }
.task-main { font-size: 18px; font-weight: 600; }
.task-sub { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); min-width: 0; }
.st-done .task-main { text-decoration: line-through; color: var(--muted); }
.st-miss .task-main { color: var(--muted); }
.tbar { width: 6px; height: 44px; border-radius: 3px; flex-shrink: 0; }
.rt-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); flex-shrink: 0; }
.picker { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 8px; padding-left: 64px; }
.opt { min-height: 52px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 10px; }
.opt-done svg { color: var(--good); } .opt-partial svg { color: var(--mid); } .opt-miss svg { color: var(--bad); }
.opt-done[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--on-status); }
.opt-partial[aria-pressed="true"] { background: var(--mid); border-color: var(--mid); color: var(--on-status); }
.opt-miss[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: var(--on-status); }
.opt[aria-pressed="true"] svg { color: var(--on-status); }
.opt-clear { border: none; background: transparent; color: var(--muted); font-size: 15px; font-weight: 600; padding: 0 14px; }
.del-row { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding-left: 64px; font-size: 14px; }
.wd-chips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd-chip { min-height: 48px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font-size: 16px; font-weight: 600; }
.wd-chip[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
.rt-list { display: flex; flex-direction: column; gap: 10px; }
.rt-item { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border: 1px solid var(--line); border-radius: 16px; }
.rt-item .task-text { gap: 2px; }

/* Stats */
.stat-nav { display: flex; align-items: center; gap: 10px; }
.stat-nav h2 { flex: 1; text-align: center; font-size: 20px; font-weight: 700; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.tile { background: var(--surface); border: 1px solid var(--card-line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 4px; box-shadow: var(--shadow); min-width: 0; }
.tile-label { font-size: 14px; font-weight: 600; color: var(--muted); }
.tile-val { font-size: clamp(21px, 3.4vw, 27px); font-weight: 700; letter-spacing: -.01em; }
.tile-sub { font-size: 13px; color: var(--muted); }
.tile-sub.up { color: var(--accent); font-weight: 600; }
.stat-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.donut-wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.donut { width: 180px; height: 180px; flex-shrink: 0; }
.donut text { fill: var(--fg); font-family: var(--font-body); }
.donut .d-sub { fill: var(--muted); font-size: 13px; }
.donut .d-main { font-size: 17px; font-weight: 700; }
.leg-list { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 10px; }
.leg-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; font-size: 15px; }
.leg-row .bd-name { font-size: 15px; }
.ratio { display: flex; height: 26px; border-radius: 8px; overflow: hidden; gap: 2px; background: var(--track); }
.ratio .r-study { background: var(--accent-fill); }
.ratio .r-break { background: repeating-linear-gradient(135deg, var(--break) 0 2px, transparent 2px 6px); box-shadow: inset 0 0 0 1px var(--break); }
.ratio-legend { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 15px; font-weight: 600; }
.reasons { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.reason { border-radius: 14px; background: var(--surface-2); padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.reason strong { font-size: 15px; }
.reason span { font-size: 13px; color: var(--muted); }
.chart { display: flex; flex-direction: column; gap: 8px; }
.cols { height: 160px; display: flex; align-items: flex-end; gap: 12px; border-bottom: 1px solid var(--line); }
.cols.month, .col-labels.month { gap: 3px; }
.dcol { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.col-val { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.bar { display: block; width: 100%; max-width: 24px; border-radius: 4px 4px 0 0; background: var(--accent-fill); }
.col-labels { display: flex; gap: 12px; }
.col-labels span { flex: 1; min-width: 0; text-align: center; font-size: 13px; color: var(--muted); }
.col-labels .is-today { color: var(--fg); font-weight: 700; }
.lc-wrap { width: 100%; min-height: 230px; }
.lc { display: block; overflow: visible; }
.lc text { fill: var(--muted); font-size: 12px; font-family: var(--font-body); }
.lc .lc-grid { stroke: var(--line); stroke-width: 1; }
.lc .lc-pt { stroke: var(--surface); stroke-width: 2; }
.tbl summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--accent); min-height: 40px; display: flex; align-items: center; }
.tbl-scroll { overflow-x: auto; }
.tbl table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
.rate-rows { display: flex; flex-direction: column; gap: 12px; }

/* Sheets & overlays */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: relative; width: 100%; max-width: 860px; margin: 0 auto; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 26px 26px 0 0; padding-top: 14px; padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
.sheet-inner { display: flex; flex-direction: column; gap: 20px; }
.grabber { align-self: center; width: 48px; height: 5px; border-radius: 3px; background: var(--line-strong); }
.sheet h2 { font-size: 23px; font-weight: 700; }
.sheet-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sheet .row-btns .btn { min-height: 56px; font-size: 17px; }
.acct-row { display: flex; align-items: center; gap: 16px; }
.acct-text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.acct-text strong { font-size: 20px; }
.viewer { position: fixed; inset: 0; z-index: 45; background: rgba(8,10,18,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: calc(70px + env(safe-area-inset-top, 0px)) 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
.viewer img { max-width: 100%; max-height: 100%; min-height: 0; object-fit: contain; border-radius: 10px; background: #fff; }
.viewer-cap { color: #E8ECF7; font-size: 16px; text-align: center; }
.viewer-close { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; display: flex; align-items: center; justify-content: center; }
.viewer :focus-visible { outline-color: #fff; }
.tip { position: fixed; z-index: 70; pointer-events: none; max-width: 260px; padding: 7px 10px; border-radius: 8px; background: var(--toast-bg); color: var(--toast-fg); font-size: 13px; font-weight: 500; box-shadow: 0 4px 14px rgba(0,0,0,.18); }

/* Timer */
.timer { position: fixed; inset: 0; z-index: 30; background: var(--ink); color: var(--on-ink); display: flex; flex-direction: column; gap: 16px; padding-top: calc(24px + env(safe-area-inset-top, 0px)); padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.timer-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--ink-muted); font-size: 15px; }
.timer-top strong { font-family: var(--font-num); font-size: 21px; }
.timer-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; transition: opacity .2s; }
.timer.paused .timer-big { opacity: .4; }
.timer-chip { display: flex; align-items: center; gap: 12px; padding: 10px 22px; border-radius: 999px; background: var(--ink-chip); font-size: 21px; font-weight: 700; max-width: 100%; }
.timer-chip .dot { width: 14px; height: 14px; }
.timer-status { font-size: 17px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.timer-big { font-size: clamp(64px, min(19vw, 26vh), 160px); font-weight: 600; line-height: 1; letter-spacing: -.02em; }
.timer-meta { display: flex; justify-content: center; gap: 20px 56px; flex-wrap: wrap; margin-top: 6px; }
.timer-meta div { display: flex; flex-direction: column; gap: 6px; }
.timer-meta span { font-size: 15px; color: var(--ink-muted); }
.timer-meta strong { font-size: 26px; font-weight: 600; }
.timer-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
.tbtn { min-height: 68px; padding: 0 32px; border-radius: 999px; border: 1px solid var(--ink-line); background: var(--ink-chip); color: var(--on-ink); font-size: 19px; font-weight: 700; display: inline-flex; align-items: center; gap: 10px; }
.tbtn-light { background: var(--on-ink); color: #10172E; border-color: var(--on-ink); }
.timer :focus-visible { outline-color: var(--on-ink); outline-offset: 3px; }
.brkp { align-self: center; width: 100%; max-width: 640px; background: var(--ink-chip); border: 1px solid var(--ink-line); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.brk-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brk-head p { font-size: 18px; font-weight: 700; }
.brk-head button { color: var(--on-ink); }
.brk-q { color: var(--ink-muted); font-size: 15px; }
.brk-chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.brk-chip { min-height: 52px; border-radius: 14px; border: 1px solid var(--ink-line); background: transparent; color: var(--on-ink); font-size: 16px; font-weight: 600; }
.brk-chip[aria-pressed="true"] { background: var(--on-ink); color: #10172E; border-color: var(--on-ink); }
.brkp input[type="text"] { background: rgba(255,255,255,.08); color: var(--on-ink); border-color: var(--ink-line); }
.brk-go { min-height: 60px; border-radius: 16px; border: none; background: var(--on-ink); color: #10172E; font-size: 18px; font-weight: 700; }

.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: var(--r-sm); background: var(--toast-bg); color: var(--toast-fg); font-size: 15px; font-weight: 500; box-shadow: 0 6px 20px rgba(0,0,0,.18); }

/* Landscape tablet: side rail + two columns */
@media (orientation: landscape) and (min-width: 900px) {
  .shell { display: grid; grid-template-columns: 104px minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
  .shell > .top { grid-column: 2; grid-row: 1; }
  .shell > .banner-wrap { grid-column: 2; grid-row: 2; }
  .shell > .main { grid-column: 2; grid-row: 3; }
  .shell > .tabs { grid-column: 1; grid-row: 1 / -1; border-top: none; border-right: 1px solid var(--line); padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: 12px; }
  .tabs .wrap { display: flex; flex-direction: column; gap: 8px; max-width: none; padding: 0; }
  .tab { min-height: 76px; }
  .wrap { max-width: 1320px; }
  .main.gut { padding-right: max(24px, env(safe-area-inset-right, 0px)); padding-left: 24px; }
  .top.gut { padding-right: max(24px, env(safe-area-inset-right, 0px)); padding-left: 24px; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .plan-split { grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); }
  .notes-split { grid-template-columns: 340px minmax(0, 1fr); }
  .notes-split .pick-grid { grid-template-columns: minmax(0, 1fr); }
  .notes-split .pick { min-height: 0; flex-direction: row; align-items: center; }

  const act = document.activeElement;

    else if (act.dataset && act.dataset.act) focus = { act: act.dataset.act, id2: act.dataset.id, v: act.dataset.v };
  }
  el.innerHTML = html;
  Object.keys(keep).forEach((id) => { const n = el.querySelector('#' + CSS.escape(id)); if (n) n.value = keep[id]; });
  if (focus) {

}

/* ---------- shared pieces ---------- */
function timelineHtml(rows, opts) {
  opts = opts || {};
  let lo = 24, hi = 0;
  rows.forEach((r) => r.items.forEach((it) => {
    const a = (it.start - r.day0) / 3.6e6, b = (it.start + it.ms - r.day0) / 3.6e6;
    lo = Math.min(lo, a); hi = Math.max(hi, b);
  }));
  if (lo > hi) { lo = 8; hi = 22; }
  lo = Math.max(0, Math.floor(lo)); hi = Math.min(24, Math.ceil(hi));
  if (hi - lo < 6) { const mid = (lo + hi) / 2; lo = Math.max(0, Math.floor(mid - 3)); hi = Math.min(24, lo + 6); lo = Math.max(0, hi - 6); }
  const span = hi - lo, step = span > 12 ? 3 : (span > 6 ? 2 : 1);
  const pct = (h) => ((h - lo) / span * 100);
  const ticks = []; for (let h = Math.ceil(lo / step) * step; h <= hi; h += step) ticks.push(h);
  const grid = ticks.filter((h) => h > lo && h < hi).map((h) => '<span class="tl-grid" style="left:' + pct(h).toFixed(2) + '%"></span>').join('');
  let h = '<div class="tl' + (opts.compact ? ' compact' : '') + '">';
  h += '<div class="tl-row" aria-hidden="true"><span class="tl-label"></span><div class="tl-axis">' + ticks.map((t) => '<span style="left:' + pct(t).toFixed(2) + '%;transform:translateX(' + (t === lo ? '0' : t === hi ? '-100%' : '-50%') + ')">' + t + '시</span>').join('') + '</div></div>';
  rows.forEach((r) => {
    h += '<div class="tl-row"><span class="tl-label' + (r.today ? ' is-today' : '') + '">' + esc(r.label) + '</span><div class="tl-track' + (opts.tall ? ' tall' : '') + '" role="img" aria-label="' + esc(r.aria || r.label) + '">' + grid;
    r.items.slice().sort((a, b) => (a.brk ? 0 : 1) - (b.brk ? 0 : 1)).forEach((it) => {
      const a = Math.max(lo, (it.start - r.day0) / 3.6e6), b = Math.min(hi, (it.start + it.ms - r.day0) / 3.6e6);
      if (b <= a) return;
      h += '<span class="tl-b' + (it.brk ? ' brk' : '') + '" style="left:' + pct(a).toFixed(2) + '%;width:' + Math.max(0.4, pct(b) - pct(a)).toFixed(2) + '%' + (it.brk ? '' : ';background:var(--s' + it.slot + ')') + '" data-tip="' + esc(it.tip) + '" title="' + esc(it.tip) + '"></span>';
    });
    h += '</div></div>';
  });
  return h + '</div>';
}

    const k = 's' + it.slot + '|' + it.name;

  const l = liveSeg(now); if (l && keyOf(new Date(l.start)) === key) ms += l.ms;
  return ms;
}
function setTaskStatus(key, id, v) {
  if (id.indexOf('r:') === 0) wr('plans/' + key + '/routine/' + id.slice(2) + '/status', v || '');
  else wr('plans/' + key + '/tasks/' + id + '/status', v || '');
}
function endRoutine(rid, fromKey) {
  const r = prof().routines.find((x) => x.id === rid); if (!r) return;
  if (!r.startKey || fromKey <= r.startKey) wr('profile/routines/' + rid, null);
  else wr('profile/routines/' + rid + '/endKey', fromKey);
}
function syncCalToSelected() { const d = dayAt(S.ui.planOff); S.ui.calY = d.getFullYear(); S.ui.calM = d.getMonth(); }

function calendarHtml() {
  const u = S.ui, y = u.calY, m = u.calM, now = Date.now();
  const first = new Date(y, m, 1), n = new Date(y, m + 1, 0).getDate(), lead = (first.getDay() + 6) % 7;
  const tkey = keyOf(new Date()), selKey = curPlanKey();
  const isThis = y === new Date().getFullYear() && m === new Date().getMonth();
  let monthMs = 0, h = '';
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span class="cal-cell blank" aria-hidden="true"></span>';
  for (let d = 1; d <= n; d++) {
    const dt = new Date(y, m, d), key = keyOf(dt), ms = studyMsOn(key, now), c = countsOf(dayTasks(key));
    monthMs += ms;
    let bar = '';
    if (c.total) {
      const w = (x) => (x / c.total * 100).toFixed(1) + '%';
      bar = '<span class="cal-bar">' + (c.done ? '<span style="width:' + w(c.done) + ';background:var(--good)"></span>' : '') + (c.partial ? '<span style="width:' + w(c.partial) + ';background:var(--mid)"></span>' : '') + (c.miss ? '<span style="width:' + w(c.miss) + ';background:var(--bad)"></span>' : '') + '</span>';
    }
    const aria = (m + 1) + '월 ' + d + '일 ' + W[dt.getDay()] + '요일' + (key === tkey ? ', 오늘' : '') + (ms ? ', 공부 ' + dur(ms) : '') + (c.total ? ', 계획 ' + c.total + '개 중 ' + c.done + '개 했어요' : '');
    cells += '<button type="button" class="cal-cell' + (key === tkey ? ' is-today' : '') + '" data-act="cal-pick" data-v="' + key + '" aria-pressed="' + (key === selKey) + '" aria-label="' + esc(aria) + '"><span class="cal-num">' + d + '</span>' + (ms >= 60000 ? '<span class="cal-time">' + hm(ms) + '</span>' : '') + bar + '</button>';
  }
  h += '<section class="card cal" aria-labelledby="h-cal"><div class="cal-head"><button type="button" class="round-btn" data-act="cal-prev" aria-label="이전 달">' + icon('chevL', 22, 2) + '</button><div class="cal-title"><h2 id="h-cal">' + y + '년 ' + (m + 1) + '월</h2><span class="sub small">이 달 공부 ' + dur(monthMs) + '</span></div><button type="button" class="round-btn" data-act="cal-next" aria-label="다음 달">' + icon('chevR', 22, 2) + '</button></div>';
  h += '<div class="cal-dow" aria-hidden="true">' + WK.map((w) => '<span>' + w + '</span>').join('') + '</div>';
  h += '<div class="cal-grid">' + cells + '</div>';
  h += '<div class="cal-legend"><span><span class="sq sm sq-done"></span>했어요</span><span><span class="sq sm sq-partial"></span>애매해요</span><span><span class="sq sm sq-miss"></span>못했어요</span><span>숫자는 공부 시간</span>' + (isThis ? '' : '<button type="button" class="link-btn" data-act="cal-today">이번 달로</button>') + '</div>';
  return h + '</section>';
}

function dayPanelHtml(land) {
  const u = S.ui, off = u.planOff, sel = dayAt(off), now = Date.now(), key = keyOf(sel), tasks = dayTasks(key);
  const rel = off === 0 ? '오늘' : off === -1 ? '어제' : off === 1 ? '내일' : off > 1 ? off + '일 후' : (-off) + '일 전';
  const relKind = off === 0 ? 'today' : off > 0 ? 'future' : 'past';
  const title = (sel.getFullYear() !== new Date().getFullYear() ? sel.getFullYear() + '년 ' : '') + longDate(sel);
  let h = '<section class="card day" aria-labelledby="h-day"><div class="day-nav"><button type="button" class="round-btn" data-act="day-prev" aria-label="이전 날">' + icon('chevL', 22, 2) + '</button><div class="day-title"><div class="day-title-row"><h2 id="h-day">' + title + '</h2><span class="rel rel-' + relKind + '">' + rel + '</span></div>' + (off ? '<button type="button" class="link-btn" data-act="day-today">오늘로 돌아가기</button>' : '') + '</div><button type="button" class="round-btn" data-act="day-next" aria-label="다음 날">' + icon('chevR', 22, 2) + '</button></div>';
  if (!land) {
    const back = (sel.getDay() + 6) % 7;
    h += '<div class="week" role="group" aria-label="날짜 선택">';
    for (let i = 0; i < 7; i++) {
      const o = off - back + i, dd = dayAt(o), has = dayTasks(keyOf(dd)).length > 0;
      h += '<button type="button" class="wd' + (o === 0 ? ' is-today' : '') + (has ? ' has' : '') + '" data-act="pick-day" data-v="' + o + '" aria-pressed="' + (o === off) + '" aria-label="' + longDate(dd) + (o === 0 ? ', 오늘' : '') + (has ? ', 계획 있음' : '') + '"><span class="wd-dow">' + WK[i] + '</span><span class="wd-num">' + dd.getDate() + '</span><span class="wd-dot"></span></button>';
    }
    h += '</div>';
  }
  const c = countsOf(tasks), rate = rateOf(c), ms = studyMsOn(key, now);
  h += '<div class="day-sum"><span>공부 <strong>' + dur(ms) + '</strong></span><span>계획 <strong>' + c.total + '개</strong></span>' + (rate != null ? '<span>이행률 <strong>' + pctTxt(rate) + '</strong></span>' : '') + '</div>';
  h += '<div id="swipe" class="swipe' + (u.slide ? ' ' + u.slide : '') + '">';
  u.slide = '';
  if (tasks.length) {
    const left = c.total - c.done - c.partial - c.miss, share = (x) => Math.round(x / c.total * 100);
    h += '<div class="progress"><div class="counts"><div class="count-list">';
    h += '<span class="count"><span class="sq sq-done">' + icon('check', 14, 3.2) + '</span>했어요 ' + c.done + '</span>';
    h += '<span class="count"><span class="sq sq-partial">' + icon('tri', 14, 3) + '</span>애매해요 ' + c.partial + '</span>';
    h += '<span class="count"><span class="sq sq-miss">' + icon('x', 14, 3.2) + '</span>못했어요 ' + c.miss + '</span>';
    h += '</div><span class="sub">' + (left > 0 ? '남은 계획 ' + left + '개' : '모두 표시했어요') + '</span></div>';
    h += '<div class="stack" role="img" aria-label="계획 ' + c.total + '개 중 했어요 ' + c.done + '개, 애매해요 ' + c.partial + '개, 못했어요 ' + c.miss + '개">';
    if (c.done) h += '<span style="width:' + share(c.done) + '%;background:var(--good)"></span>';
    if (c.partial) h += '<span style="width:' + share(c.partial) + '%;background:var(--mid)"></span>';
    if (c.miss) h += '<span style="width:' + share(c.miss) + '%;background:var(--bad)"></span>';

    tasks.forEach((t) => {

      if (sub || t.routine) h += '<span class="task-sub">' + (t.routine ? '<span class="rt-badge">' + icon('repeat', 12, 2.2) + '루틴</span>' : '') + (sub ? '<span class="ellip">' + esc(sub) + '</span>' : '') + '</span>';

      }
      h += '</div>';
    });
  } else {
    h += '<div class="empty-box" style="border:none;padding:32px 16px 16px">' + icon('cal', 40, 1.8) + '<p class="empty-title">' + (off < 0 ? '이 날 적어 둔 계획이 없어요' : '아직 계획이 없어요') + '</p><p>옆으로 넘기면 지난 계획과 앞으로의 계획을 볼 수 있어요</p></div>';
  }
  h += '<button type="button" class="btn-dashed" data-act="plan-add">' + icon('plus', 22, 2) + '<span>계획 추가하기</span></button></div>';
  const items = dayItems(key, now);
  if (items.length) h += '<div class="field"><span class="mini-label">이날의 타임라인</span>' + timelineHtml([{ label: shortDate(sel), day0: sel.getTime(), items: items, aria: shortDate(sel) + ' 타임라인' }], { compact: true }) + '</div>';
  return h + '</section>';
}

  if (sh.repeat) {
    h += '<div class="wd-chips" role="group" aria-label="반복할 요일">' + WK.map((w, i) => '<button type="button" class="wd-chip" data-act="sheet-wd" data-v="' + WK_NUM[i] + '" aria-pressed="' + !!sh.days[WK_NUM[i]] + '">' + w + '</button>').join('') + '</div><p class="sub small">이 날부터 고른 요일마다 계획에 자동으로 들어가요</p>';
  }
  h += '</div>';
  if (sh.error) h += '<p class="err" role="alert">' + esc(sh.error) + '</p>';

function submitSheet() {
  const sh = S.ui.sheet; if (!sh) return;
  const subs = prof().subjects;
  let subject, subjectId = null, slot = null;
  if (subs.length) {
    const s = subs.find((x) => x.id === sh.subjectId);
    if (!s) { sh.error = '과목을 골라 주세요'; renderSheet(); return; }
    subject = s.name; subjectId = s.id; slot = slotNum(s.slot);
  } else {
    subject = ($('#sheet-custom') ? $('#sheet-custom').value : '').trim();
    if (!subject) { sh.error = '과목 이름을 적어 주세요'; renderSheet(); return; }
  }
  const book = ($('#sheet-book').value || '').trim(), amount = ($('#sheet-amount').value || '').trim();
  if (!book && !amount) { sh.error = '교재나 분량을 적어 주세요'; renderSheet(); return; }
  const key = curPlanKey();
  if (sh.repeat) {
    const days = Object.keys(sh.days).filter((k) => sh.days[k]).map(Number).sort();
    if (!days.length) { sh.error = '반복할 요일을 하나 이상 골라 주세요'; renderSheet(); return; }
    wr('profile/routines/rt' + genId(), { subjectId: subjectId, subject: subject, slot: slot, book: book, amount: amount, days: days, startKey: key, order: Date.now() });
    closeSheet(); toast('루틴을 만들었어요');
  } else {
    wr('plans/' + key + '/tasks/t' + genId(), { subjectId: subjectId, subject: subject, slot: slot, book: book, amount: amount, status: '', order: Date.now() });
    closeSheet(); toast('계획을 추가했어요');
  }
}

function periodRange(per, off) {
  const t = new Date(), y = t.getFullYear(), m = t.getMonth(), d = t.getDate();
  let a, n, label, prevA, prevWord;

  else if (per === 'week') {
    const back = (t.getDay() + 6) % 7; a = new Date(y, m, d - back + off * 7); n = 7;
    const b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 6);
    label = (a.getMonth() + 1) + '월 ' + a.getDate() + '일 – ' + (b.getMonth() + 1) + '월 ' + b.getDate() + '일';
    prevA = new Date(a.getFullYear(), a.getMonth(), a.getDate() - 7); prevWord = '전 주';
  } else {
    a = new Date(y, m + off, 1); n = new Date(a.getFullYear(), a.getMonth() + 1, 0).getDate();
    label = a.getFullYear() + '년 ' + (a.getMonth() + 1) + '월'; prevA = new Date(a.getFullYear(), a.getMonth() - 1, 1); prevWord = '전 달';
  }
  const days = []; for (let i = 0; i < n; i++) days.push(new Date(a.getFullYear(), a.getMonth(), a.getDate() + i));
  const from = a.getTime(), to = new Date(a.getFullYear(), a.getMonth(), a.getDate() + n).getTime();
  const today0 = startOf(0), elapsed = Math.max(1, days.filter((x) => x.getTime() <= today0).length);
  return { per, off, from, to, days, label, prevFrom: prevA.getTime(), prevTo: from, prevWord, elapsed, today0 };
}

  let acc = 0, segs = '';

    const len = r.ms / total * C;
    segs += '<circle cx="90" cy="90" r="' + R + '" fill="none" style="stroke:var(--s' + r.slot + ')" stroke-width="26" stroke-dasharray="' + Math.max(0.5, len - gap).toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 90 90)" data-tip="' + esc(r.name + ' ' + dur(r.ms) + ' · ' + Math.round(r.ms / total * 100) + '%') + '"><title>' + esc(r.name + ' ' + dur(r.ms)) + '</title></circle>';

  [0, 0.5, 1].forEach((v) => { s += '<line class="lc-grid" x1="' + L + '" x2="' + (L + iw) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"></line><text x="' + (L - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + Math.round(v * 100) + '%</text>'; });
  d.labels.forEach((lb, i) => { if (lb) s += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(lb) + '</text>'; });

  g.strokeStyle = '#E2E6EF'; g.lineWidth = 2; g.beginPath(); g.moveTo(M, y + 8); g.lineTo(Wd - M, y + 8); g.stroke();
  y += 40;
  const bw = Wd - M * 2, bh = Ht - y - M, iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const sc = Math.min(bw / iw, bh / ih), dw = iw * sc, dh = ih * sc;
  g.drawImage(img, M + (bw - dw) / 2, y, dw, dh);

}
function buildPdf(pages) {
  const enc = (str) => { const a = new Uint8Array(str.length); for (let i = 0; i < str.length; i++) a[i] = str.charCodeAt(i) & 0xff; return a; };
  const parts = [], offsets = []; let pos = 0;
  const push = (u8) => { parts.push(u8); pos += u8.length; };
  const obj = (num, body, stream) => {
    offsets[num] = pos;
    if (stream) { push(enc(num + ' 0 obj\n' + body + '\nstream\n')); push(stream); push(enc('\nendstream\nendobj\n')); }
    else push(enc(num + ' 0 obj\n' + body + '\nendobj\n'));
  };
  const n = pages.length, total = 2 + n * 3;
  push(enc('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [' + pages.map((p, i) => (3 + i * 3) + ' 0 R').join(' ') + '] /Count ' + n + ' >>');
  pages.forEach((p, i) => {
    const pn = 3 + i * 3, cn = pn + 1, im = pn + 2;
    obj(pn, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + cn + ' 0 R >>');
    const content = enc('q 595.28 0 0 841.89 0 0 cm /Im0 Do Q');
    obj(cn, '<< /Length ' + content.length + ' >>', content);
    obj(im, '<< /Type /XObject /Subtype /Image /Width ' + p.w + ' /Height ' + p.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + p.bytes.length + ' >>', p.bytes);
  });
  const xrefPos = pos; let xref = 'xref\n0 ' + (total + 1) + '\n0000000000 65535 f \n';
  for (let k = 1; k <= total; k++) xref += String(offsets[k]).padStart(10, '0') + ' 00000 n \n';
  push(enc(xref + 'trailer\n<< /Size ' + (total + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF\n'));

async function exportPdf() {
  const u = S.ui, chosen = S.data.notes.filter((n) => u.selected[n.id]);
  if (!chosen.length || u.exporting) return;
  u.exportMsg = '';
  try {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
    const pages = [];
    for (let i = 0; i < chosen.length; i++) {
      u.exporting = 'PDF 만드는 중… (' + (i + 1) + '/' + chosen.length + ')'; renderNotes();
      pages.push(await renderPage(chosen[i], i, chosen.length));
    }
    const blob = buildPdf(pages), d = new Date();
    const name = 'LiveYourLife_WrongNotes_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.pdf';
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    u.exporting = ''; u.selectMode = false; u.selected = {}; u.exportMsg = chosen.length + '문제를 PDF로 저장했어요. 다운로드 폴더를 확인해 주세요.'; u.exportErr = false;
  } catch (e) {
    u.exporting = ''; u.exportMsg = 'PDF를 만들지 못했어요. 다시 시도해 주세요.'; u.exportErr = true;
  }
  renderNotes();
}

/* ---------- events ---------- */
let suppressClick = false;
document.addEventListener('click', (e) => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); return; }
  const b = e.target.closest('[data-act]');
  if (!b) { const t = e.target.closest('[data-tip]'); if (t) showTip(t); else hideTip(); return; }
  if (b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id, v = b.dataset.v, u = S.ui;
  switch (a) {
    case 'auth-to-signup': showAuth('signup'); break;
    case 'auth-to-login': showAuth('login'); break;
    case 'auth-back': showAuth('start'); break;
    case 'toggle-pw': u.showPw = !u.showPw; renderAuth(); break;
    case 'auth-google': googleAuth(); break;
    case 'auth-forgot': forgotPw(); break;
    case 'acct-open': openAcct(); break;
    case 'acct-close': closeAcct(); break;
    case 'logout': doLogout(); break;
    case 'tab': showTab(v); break;
    case 'start': startTimer(id); break;
    case 'toggle-edit': u.editing = !u.editing; u.adding = false; u.addError = ''; renderStudy(); break;
    case 'del-subject': wr('profile/subjects/' + id, null); break;
    case 'add-open': { u.adding = true; u.addError = ''; renderStudy(); const ni = $('#new-subject'); if (ni) ni.focus(); break; }
    case 'add-cancel': u.adding = false; u.addError = ''; renderStudy(); break;
    case 'timer-toggle': {
      const t = prof().timer; if (!t) break;
      if (t.segStart) pauseTimer();
      else if (t.pausedAt) { u.brkOpen = true; u.brkReason = 'rest'; $('#brk-custom').value = ''; renderTimer(); const c = $('#brk .brk-chip[aria-pressed="true"]'); if (c) c.focus(); }
      else resumeTimer('', '');
      break;
    }
    case 'timer-stop': stopTimer(); break;
    case 'brk-reason': u.brkReason = v; renderTimer(); if (v === 'custom') $('#brk-custom').focus(); break;
    case 'brk-close': u.brkOpen = false; renderTimer(); $('#timer-toggle').focus(); break;
    case 'brk-go': {
      const label = u.brkReason === 'custom' ? (($('#brk-custom').value || '').trim().slice(0, 20) || '기타') : REASON_LABEL[u.brkReason];
      resumeTimer(u.brkReason, label);
      break;
    }
    case 'pick-camera': $('#file-camera').click(); break;
    case 'pick-gallery': $('#file-gallery').click(); break;
    case 'note-subject': u.noteSubject = v; renderNotes(); break;
    case 'note-cancel': u.draft = null; u.noteSubject = ''; renderNotes(); break;
    case 'note-save': saveNote(); break;
    case 'note-del': u.confirmDel = id; renderNotes(); break;
    case 'note-del-no': u.confirmDel = null; renderNotes(); break;
    case 'note-del-yes': deleteNote(id); break;
    case 'view-note': openViewer(id); break;
    case 'viewer-close': closeViewer(); break;
    case 'select-on': u.selectMode = true; u.selected = {}; u.exportMsg = ''; u.confirmDel = null; renderNotes(); break;
    case 'select-off': u.selectMode = false; u.selected = {}; renderNotes(); break;
    case 'select-all': {
      const all = S.data.notes.length && S.data.notes.every((n) => u.selected[n.id]);
      u.selected = {}; if (!all) S.data.notes.forEach((n) => { u.selected[n.id] = true; });
      renderNotes(); break;
    }
    case 'note-toggle': if (u.selected[id]) delete u.selected[id]; else u.selected[id] = true; renderNotes(); break;
    case 'export': exportPdf(); break;
    case 'dd-edit': { u.ddEditing = true; u.ddError = ''; renderPlan(); const dt = $('#dd-title'); if (dt) dt.focus(); break; }
    case 'dd-cancel': u.ddEditing = false; u.ddError = ''; renderPlan(); break;
    case 'dd-remove': u.ddEditing = false; wr('profile/dday', null); renderPlan(); break;
    case 'plan-mode': u.planMode = v; if (v === 'month') syncCalToSelected(); renderPlan(); break;
    case 'cal-prev': u.calM--; if (u.calM < 0) { u.calM = 11; u.calY--; } renderPlan(); break;
    case 'cal-next': u.calM++; if (u.calM > 11) { u.calM = 0; u.calY++; } renderPlan(); break;
    case 'cal-today': u.calY = new Date().getFullYear(); u.calM = new Date().getMonth(); renderPlan(); break;
    case 'cal-pick': {
      u.planOff = offOfKey(v); u.pickerFor = null; u.taskDel = null;
      if (!isLand()) u.planMode = 'day';
      renderPlan(); break;
    }
    case 'day-prev': moveDay(-1); break;
    case 'day-next': moveDay(1); break;
    case 'day-today': u.planOff = 0; u.pickerFor = null; u.taskDel = null; syncCalToSelected(); renderPlan(); break;
    case 'pick-day': { const o = parseInt(v, 10); if (o !== u.planOff) { u.slide = o > u.planOff ? 'in-right' : 'in-left'; u.planOff = o; u.pickerFor = null; u.taskDel = null; syncCalToSelected(); renderPlan(); } break; }
    case 'cell': u.pickerFor = u.pickerFor === id ? null : id; u.taskDel = null; renderPlan(); break;
    case 'status': {
      u.pickerFor = null;
      setTaskStatus(curPlanKey(), id, v);
      renderPlan();
      const cb = $('.cell[data-id="' + CSS.escape(id) + '"]'); if (cb) cb.focus();
      break;
    }
    case 'task-del':
      if (id.indexOf('r:') === 0) { u.taskDel = u.taskDel === id ? null : id; u.pickerFor = null; renderPlan(); }
      else wr('plans/' + curPlanKey() + '/tasks/' + id, null);
      break;
    case 'task-del-no': u.taskDel = null; renderPlan(); break;
    case 'task-skip': u.taskDel = null; wr('plans/' + curPlanKey() + '/routine/' + id.slice(2) + '/skip', true); renderPlan(); break;
    case 'task-endroutine': u.taskDel = null; endRoutine(id.slice(2), curPlanKey()); renderPlan(); toast('루틴을 그만했어요. 지난 기록은 그대로 남아요'); break;
    case 'routines-open': openRoutines(); break;
    case 'routines-close': closeRoutines(); break;
    case 'routine-end': endRoutine(id, keyOf(new Date())); break;
    case 'plan-add': openSheet(); break;
    case 'sheet-close': closeSheet(); break;
    case 'sheet-subject': if (u.sheet) { u.sheet.subjectId = id; u.sheet.error = ''; renderSheet(); } break;
    case 'sheet-repeat': if (u.sheet) { u.sheet.repeat = v === 'weekly'; u.sheet.error = ''; renderSheet(); } break;
    case 'sheet-wd': if (u.sheet) { u.sheet.days[v] = !u.sheet.days[v]; u.sheet.error = ''; renderSheet(); } break;
    case 'stat-per': u.statPer = v; u.statOff = 0; renderStats(); break;
    case 'stat-prev': u.statOff--; renderStats(); break;
    case 'stat-next': if (u.statOff < 0) { u.statOff++; renderStats(); } break;
  }
});
document.addEventListener('pointerover', (e) => {
  if (e.pointerType !== 'mouse') return;
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (t && !t.closest('[data-act]')) showTip(t);
});
document.addEventListener('pointerout', (e) => { if (e.pointerType === 'mouse' && e.target.closest && e.target.closest('[data-tip]')) hideTip(); });
document.addEventListener('submit', (e) => {
  const f = e.target; e.preventDefault();
  if (f.id === 'auth-email-form') submitAuth();
  else if (f.id === 'add-subject-form') addSubject();
  else if (f.id === 'sheet-form') submitSheet();
  else if (f.id === 'dd-form') {
    const title = ($('#dd-title').value || '').trim().slice(0, 20), date = $('#dd-date').value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { S.ui.ddError = '날짜를 골라 주세요'; renderPlan(); return; }
    S.ui.ddEditing = false; S.ui.ddError = '';
    wr('profile/dday', { title: title || 'D-day', date: date });
    renderPlan();
  }
});
document.addEventListener('change', (e) => { if (e.target && e.target.id === 'auth-keep') S.ui.keep = e.target.checked; });
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t && t.id && t.id.indexOf('auth-') === 0 && t.getAttribute('aria-invalid') === 'true') { t.removeAttribute('aria-invalid'); S.ui.invalid = ''; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target && e.target.id === 'brk-custom' && !e.isComposing) { e.preventDefault(); $('#brk .brk-go').click(); return; }
  if (e.key !== 'Escape' || e.isComposing) return;
  hideTip();
  if (!$('#viewer').hidden) closeViewer();
  else if (!$('#acct').hidden) closeAcct();
  else if (!$('#rsheet').hidden) closeRoutines();
  else if (S.ui.sheet) closeSheet();
  else if (S.ui.brkOpen) { S.ui.brkOpen = false; renderTimer(); }
  else if (S.ui.taskDel || S.ui.pickerFor) { S.ui.taskDel = null; S.ui.pickerFor = null; renderPlan(); }
  else if (S.ui.selectMode) { S.ui.selectMode = false; S.ui.selected = {}; renderNotes(); }
});
['file-camera', 'file-gallery'].forEach((fid) => {
  $('#' + fid).addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    toast('사진을 준비하는 중이에요');
    prepareImage(f).then((d) => {
      S.ui.draft = d; S.ui.noteSubject = ''; renderNotes(); $('#toast').hidden = true;
      const m = $('#note-memo'); if (m) m.focus({ preventScroll: false });
    }).catch(() => toast('사진을 열지 못했어요. 다른 사진으로 해 주세요.'));
  });
});
$('#main').addEventListener('scroll', hideTip, { passive: true });

/* swipe between days */
(() => {
  const view = $('#view-plan'); let drag = null;
  view.addEventListener('pointerdown', (e) => {
    const sw = e.target.closest('#swipe');
    if (!sw || (e.pointerType === 'mouse' && e.button !== 0)) return;
    drag = { x: e.clientX, y: e.clientY, moved: false, el: sw, id: e.pointerId };
  });
  view.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved) {
      if (Math.abs(dx) < 10) return;
      if (Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
      drag.moved = true;
      try { drag.el.setPointerCapture(drag.id); } catch (err) {}
      drag.el.style.transition = 'none';
    }
    const cl = Math.max(-260, Math.min(260, dx));
    drag.el.style.transform = 'translateX(' + cl + 'px)';
    drag.el.style.opacity = String(1 - Math.min(Math.abs(cl) / 600, 0.35));
  });
  const end = (e, cancel) => {
    if (!drag) return;
    const d = drag; drag = null;
    const dx = cancel ? 0 : e.clientX - d.x;
    if (d.moved) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 0); }
    if (d.moved && dx <= -80) moveDay(1);
    else if (d.moved && dx >= 80) moveDay(-1);
    else { d.el.style.transition = ''; d.el.style.transform = ''; d.el.style.opacity = ''; }
  };
  view.addEventListener('pointerup', (e) => end(e, false));
  view.addEventListener('pointercancel', (e) => end(e, true));
})();

/* orientation & size changes */
const onLandChange = () => { hideTip(); if (S.uid) renderAll(); };
if (LAND_MQ.addEventListener) LAND_MQ.addEventListener('change', onLandChange); else if (LAND_MQ.addListener) LAND_MQ.addListener(onLandChange);
let resizeT = null;
if (window.ResizeObserver) {
  new ResizeObserver(() => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      const el = $('#rate-chart');
      if (el && S.ui.tab === 'stats' && Math.abs((+el.dataset.w || 0) - el.clientWidth) > 6) drawRateChart();
    }, 150);
  }).observe($('#main'));
}

document.addEventListener('visibilitychange', () => { syncWake(); if (document.visibilityState === 'visible') renderAll(); });
setInterval(() => {
  const k = keyOf(new Date());
  if (k !== S.ui.todayKey) { S.ui.todayKey = k; renderAll(); return; }
  const t = prof().timer;
  if (!S.uid || !t) return;
  updateTicks();
  if (t.segStart && S.ui.tab === 'study' && Date.now() - lastStudyPaint > 30000 && $('#timer').hidden) { renderStudy(); lastStudyPaint = Date.now(); }
}, 500);

/* ---------- boot ---------- */
document.querySelectorAll('[data-icon]').forEach((el) => el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon, +el.dataset.size || 24)));
onAuthStateChanged(auth, (user) => {
  S.authReady = true;
  if (user) {
    S.user = user;
    if (S.uid !== user.uid) startStore(user.uid);
    showApp();
  } else {
    stopStore(); S.user = null;
    showAuth('start');
  }
});
</script>
